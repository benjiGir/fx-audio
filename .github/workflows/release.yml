name: Release

# Creates the tag and the GitHub release of the version in package.json, with its CHANGELOG.md section as the notes.
# Run it by hand once the "version" pull request is merged. It does not publish to npm.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, as written in package.json (for example 1.0.0)
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the version
        run: |
          current=$(node -p "require('./package.json').version")
          if [ "$current" != "${{ inputs.version }}" ]; then
            echo "package.json is at $current, not ${{ inputs.version }}" >&2
            exit 1
          fi
      - name: Write the release notes
        run: node scripts/release-notes.mjs "${{ inputs.version }}" > "$RUNNER_TEMP/notes.md"
      - name: Create the tag and the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ inputs.version }}" \
            --title "v${{ inputs.version }}" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --target "$GITHUB_SHA" \
            --latest
